name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Same checks before a merge, not only after one. The deploy job and the
  # artifact upload are both gated on this NOT being a pull_request — without
  # that guard a PR build would publish itself to the live site.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege, per job rather than workflow-wide: only the deploy job
# publishes, so only it gets pages:write and id-token:write. The build job runs
# the tests and builds the bundle, and reads. Set at the top this used to hand
# a write-to-Pages token to every step of the build, including npm ci.
permissions:
  contents: read

concurrency:
  # Per-PR on pull_request so two open PRs do not cancel each other, and so a PR
  # build never cancels an in-flight deploy of main. Real deploys keep sharing
  # the single "pages" group, which is what serialises them.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole job is ~3 minutes. A cap means a hung step fails in ten rather
    # than sitting on a runner for the default six hours.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # setup-node v5 began caching automatically when package.json has a
      # `packageManager` field, and v6 narrowed that to npm. This repo has no
      # such field and sets `cache` explicitly below, so the automatic path
      # never engages and the behaviour is unchanged.
      # 24, matching what the site is actually built with locally (24.17 at
      # the time of the bump) and what the pre-push hook has been building and
      # payload-checking on all along. Node 20 is past end-of-life, and CI
      # building on a different major from every developer is how a build-only
      # failure hides until release day.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cycling-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cycling-app

      # Pipeline unit tests. These are pure-stdlib and need no database — the
      # ingest tests build a scratch DB from schema.sql, which also keeps that
      # file from drifting out of sync with what ingest_race.py writes (it had:
      # route_type was missing until 2026-08-08, so a DB rebuilt from schema.sql
      # could not be written to at all).
      #
      # Note there is no validate_db.py step: cycling.db is gitignored and not
      # regenerable in CI, so the database itself can only be validated locally.
      - name: Run pipeline tests
        run: python3 -m unittest discover -p 'test_*.py' -v
        working-directory: pipeline

      - name: Validate exported data
        run: python3 validate_exports.py
        working-directory: pipeline

      - name: Build
        run: npm run build
        working-directory: cycling-app

      - name: Smoke-test built bundle
        run: node verify.mjs && node verify-views.mjs
        working-directory: cycling-app

      # Payload budget. Compares the gzipped size of every asset against the
      # committed baseline, so an exporter or encoding change that quietly
      # inflates the site fails here rather than just making it slower. Real
      # growth (a new year, a new race) is re-baselined deliberately with
      # `node check-payload.mjs --update` in the commit that causes it.
      - name: Check payload budget
        run: node check-payload.mjs
        working-directory: cycling-app

      # Nothing to publish from a PR — it has not been merged yet.
      #
      # v4 of this action stopped including hidden files (dotfiles) in the
      # artifact. Checked before bumping: `cycling-app/build/` contains none,
      # and nothing here needs a `.nojekyll` — artifact-based Pages deployment
      # does not run Jekyll. v5 is the one that carries upload-artifact v7,
      # which is what actually clears the transitive Node 20 deprecation.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: cycling-app/build

  deploy:
    needs: build
    # PRs run the checks above and stop there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
