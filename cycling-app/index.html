<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stage-by-stage GC, sprint and KOM analytics for the Tour de France, Giro d'Italia and Vuelta a España, plus 11 one-day monuments and classics — 1892–2026." />
    <meta property="og:title" content="Tour de France, Giro, Vuelta & One-Day Classics Cycling Analytics" />
    <meta property="og:description" content="Stage-by-stage GC, sprint and KOM analytics for the Tour de France, Giro d'Italia and Vuelta a España, plus 11 one-day monuments and classics — 1892–2026." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ericshiflet.com/tdf-analytics/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tour de France, Giro, Vuelta & One-Day Classics Cycling Analytics" />
    <meta name="twitter:description" content="Stage-by-stage GC, sprint and KOM analytics for the Tour de France, Giro d'Italia and Vuelta a España, plus 11 one-day monuments and classics — 1892–2026." />
    <link rel="canonical" href="https://www.ericshiflet.com/tdf-analytics/" />
    <title>Tour de France, Giro, Vuelta &amp; One-Day Classics Cycling Analytics</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cycling Analytics",
        "url": "https://www.ericshiflet.com/tdf-analytics/",
        "description": "Stage-by-stage GC, sprint and KOM analytics for the Tour de France, Giro d'Italia and Vuelta a España, plus 11 one-day monuments and classics — 1892–2026."
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-row">
          <h1>
            <!-- Options populated from the race registry in main.ts -->
            <select id="race-select" class="race-select"></select>
            <select id="year-select" class="year-select"></select>
          </h1>
          <nav class="view-nav">
            <button id="view-stage" class="view-btn active">
              <select id="metric-select" class="metric-inline">
                <option value="gc">GC</option>
                <option value="points">Sprint</option>
                <option value="kom">KOM</option>
              </select>
              <select id="stage-view-select" class="metric-inline">
                <option value="" disabled hidden></option>
                <option value="graph">by Stage Graph</option>
                <option value="table">by Stage Table</option>
              </select>
            </button>
            <button id="view-overview" class="view-btn">Race Overview</button>
            <button id="view-all-races" class="view-btn">All Years Summary</button>
            <button id="view-riders" class="view-btn">Riders</button>
          </nav>
          <div id="overview-summary" class="overview-summary" hidden></div>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <div class="control-block">
            <label for="search">Find a rider</label>
            <input id="search" type="text" placeholder="e.g. Pogačar" autocomplete="off" />
          </div>

          <div class="control-block">
            <span class="control-label">Quick select</span>
            <div class="button-row">
              <button data-preset="10">Top 10</button>
              <button data-preset="20" class="active">Top 20</button>
              <button data-preset="all">All</button><button data-preset="none">None</button>
            </div>
            <div class="filter-row">
              <div class="filter-dropdown">
                <button type="button" class="filter-toggle-btn" id="team-filter-btn">Team</button>
                <div class="filter-panel" id="team-filter-panel" hidden></div>
              </div>
              <div class="filter-dropdown">
                <button type="button" class="filter-toggle-btn" id="nation-filter-btn">Nation</button>
                <div class="filter-panel" id="nation-filter-panel" hidden></div>
              </div>
            </div>
          </div>

          <div class="control-block legend-block">
            <span class="control-label">Riders (click to toggle)</span>
            <div id="legend" class="legend"></div>
          </div>
        </aside>

        <main class="chart-area">
          <button id="gc-time-toggle" type="button" class="y-axis-toggle" hidden>GC Time</button>
          <button id="sprint-mode-toggle" type="button" class="y-axis-toggle" hidden>Rank → Points</button>
          <button id="kom-mode-toggle" type="button" class="y-axis-toggle" hidden>Rank → Points</button>
          <button id="all-races-unit-toggle" type="button" class="unit-toggle" hidden>km → mi</button>
          <button id="overview-unit-toggle" type="button" class="unit-toggle" hidden>km → mi</button>
          <div id="chart"></div>
          <div id="stage-table"></div>
          <div id="overview-chart"></div>
          <div id="all-races-chart"></div>
          <div id="riders-chart"></div>
          <div id="tooltip" class="tooltip" hidden></div>
        </main>
      </div>

      <footer class="site-footer">
        <a href="/tdf-analytics/tour/">Tour de France</a>
        <a href="/tdf-analytics/giro/">Giro d'Italia</a>
        <a href="/tdf-analytics/vuelta/">Vuelta a España</a>
        <a href="/tdf-analytics/classics/">One-day Classics</a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a2a9ae3d57a14b82b92e1750fee09677"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
